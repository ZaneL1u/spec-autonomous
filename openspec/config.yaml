schema: spec-driven
context: |
  Spec Autonomous accepts a milestone goal or existing OpenSpec/Spec Kit work,
  plans a multi-phase roadmap using native workflows, then autonomously plans,
  implements, verifies and repairs the whole milestone or a from/to phase range.
  Native/manual and autonomous modes share original Markdown specifications.
  Skills call a common CLI. TOML stores configuration and orchestration declarations;
  structured CLI views parse native MD metadata and report all Git worktrees.
  User entry is /autonomous with exact alias /auto where supported by the host.
  Init binds host skills/commands to the user's existing SDD provider; it never
  silently replaces their framework or substitutes a private SDD workflow.
  Stack: Rust workspace, Node.js 22+ npm launcher, Bun 1.4.2, Rust 1.98.1.
  Bootstrap currently implements only read-only detection and npm packaging;
  product skills, roadmap, bounded execution and all-worktree progress are planned.
  Runtime is planned in autonomous-orchestration; it is not implemented yet.
  Existing specs own requirements. A future SQLite ledger owns attempts/evidence.
  Each worker uses a fresh session and isolated worktree; the coordinator alone
  integrates code and writes shared completion state. Unknown write sets serialize.
  Use docs/research/upstreams.lock.json for upstream compatibility baselines.
  Documentation is primarily Chinese; code and JSON identifiers use English.
  Report actual macOS checks separately from unrun platforms and external agents.
rules:
  proposal:
    - Lead with the autonomous milestone outcome and observable capabilities.
  design:
    - Specify unattended continuation, failure recovery and completion criteria.
    - Include source revision checks, adapter capabilities and fresh context rules.
  tasks:
    - Include a concrete verification method in every task.
    - Leave future implementation unchecked; artifact readiness is not code completion.
operations:
  apply:
    guidance:
      - Continue authorized independent work and routine verification within scope.
      - Record evidence before updating task checkboxes; coordinator owns shared writes.
  archive:
    guidance:
      - Archive only a completed change with relevant verification evidence.
