schema_version = 1
verification = [{ argv = ["cargo", "test", "--workspace", "--locked"], cwd = "." }]

[execution]
mode = "autonomous"
max_workers = 3
max_attempts = 3
attempt_timeout_seconds = 1800
run_timeout_seconds = 28800
max_repair_rounds = 2
no_progress_limit = 2
delivery = "ff-original"
max_log_bytes = 8388608
max_context_bytes = 131072
max_source_bytes = 2097152
max_planner_tasks = 32

[runner]
profile = "codex"
command = ["codex"]
fresh_session = true
sandbox = "codex-per-unit"

[runner.environment]

[provider]
openspec_command = []

[hooks]

[policy]
archive = false
push = false
publish = false
